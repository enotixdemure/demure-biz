<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Elite Family | Businesses</title>
    <!-- Telegram Web App JS -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Шрифты Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #070709;
            --bg-card: rgba(22, 22, 28, 0.7);
            --bg-card-hover: rgba(30, 30, 38, 0.85);
            --border-gold: rgba(212, 175, 55, 0.25);
            --border-gold-hover: rgba(212, 175, 55, 0.6);
            --gold-primary: #dfb953;
            --gold-light: #fbe8a6;
            --gold-dark: #9c7b23;
            --text-main: #f3f3f6;
            --text-muted: #94949f;
            --shadow-gold: rgba(223, 185, 83, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(223, 185, 83, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(156, 123, 35, 0.04) 0%, transparent 40%);
            color: var(--text-main);
            padding-bottom: 110px;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Элитная шапка */
        .header {
            text-align: center;
            padding: 30px 16px 20px;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-gold), transparent);
        }

        .header h1 {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-primary) 50%, var(--gold-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            text-shadow: 0 5px 25px rgba(223, 185, 83, 0.2);
        }

        .header p {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Контейнер */
        .container {
            padding: 20px 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 13px;
            font-weight: 700;
            color: var(--gold-primary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .biz-count {
            font-size: 11px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Сетка карточек */
        .grid-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Премиум карточка бизнеса */
        .business-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            padding: 18px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.4s ease forwards;
        }

        .business-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(to bottom, var(--gold-light), var(--gold-dark));
        }

        .business-card:hover {
            border-color: var(--border-gold-hover);
            background: var(--bg-card-hover);
            box-shadow: 0 10px 40px var(--shadow-gold);
            transform: translateY(-2px);
        }

        .biz-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .biz-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .biz-type-badge {
            font-size: 9px;
            font-weight: 700;
            background: linear-gradient(135deg, rgba(223, 185, 83, 0.15), rgba(156, 123, 35, 0.1));
            color: var(--gold-light);
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid rgba(223, 185, 83, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .biz-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
            margin-bottom: 14px;
        }

        .biz-info-row {
            display: flex;
            align-items: center;
            color: var(--text-muted);
        }

        .biz-info-row span {
            color: var(--text-main);
            font-weight: 500;
            margin-left: 8px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 12px;
        }

        .discount-tag {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-primary) 50%, var(--gold-dark) 100%);
            color: #0c0c0e;
            font-weight: 800;
            font-size: 11px;
            padding: 6px 14px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(223, 185, 83, 0.25);
        }

        .owner-info {
            font-size: 11px;
            color: var(--text-muted);
        }

        .owner-info span {
            color: var(--gold-light);
            font-weight: 600;
        }

        /* Нижняя фиксированная панель навигации */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 13, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-gold);
            display: flex;
            overflow-x: auto;
            padding: 12px 10px;
            gap: 8px;
            z-index: 1000;
            scrollbar-width: none;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
        }

        .bottom-nav::-webkit-scrollbar {
            display: none;
        }

        .nav-item {
            flex: 0 0 auto;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            padding: 9px 16px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .nav-item.active {
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-primary) 50%, var(--gold-dark) 100%);
            color: #0c0c0e;
            border-color: var(--gold-primary);
            font-weight: 700;
            box-shadow: 0 0 20px rgba(223, 185, 83, 0.35);
            transform: translateY(-1px);
        }

        .no-results {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
            font-size: 13px;
            letter-spacing: 1px;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px dashed var(--border-gold);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Family Syndicate</h1>
        <p>Реестр предприятий и привилегий</p>
    </div>

    <div class="container">
        <div class="section-header">
            <div class="section-title" id="current-category-title">Все бизнесы</div>
            <div class="biz-count" id="biz-count">0 шт.</div>
        </div>

        <div class="grid-list" id="business-list"></div>
    </div>

    <!-- Нижняя сетка типов бизнесов -->
    <div class="bottom-nav" id="filter-nav">
        <div class="nav-item active" onclick="filterBusinesses('all', this)">Все</div>
        <div class="nav-item" onclick="filterBusinesses('АЗС', this)">АЗС</div>
        <div class="nav-item" onclick="filterBusinesses('24/7', this)">24/7</div>
        <div class="nav-item" onclick="filterBusinesses('Одежда', this)">Одежда</div>
        <div class="nav-item" onclick="filterBusinesses('Амуниция', this)">Амуниция</div>
        <div class="nav-item" onclick="filterBusinesses('Автосалон', this)">Автосалон</div>
    </div>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();

        // База данных бизнесов (можно легко редактировать)
        const businesses = [
            {
                id: 1,
                name: "АЗС №4 (У казика)",
                type: "АЗС",
                location: "Район Казино / Лос-Сантос",
                discount: "15%",
                owner: "Raccoon_Demure"
            },
            {
                id: 2,
                name: "Магазин 24/7 №12",
                type: "24/7",
                location: "Центр Лос-Сантоса (возле банка)",
                discount: "20%",
                owner: " Syndicate Member"
            },
            {
                id: 3,
                name: "Амуниция г. Сан-Фиерро",
                type: "Амуниция",
                location: "Центральный рынок SF",
                discount: "10%",
                owner: " Syndicate Member"
            },
            {
                id: 4,
                name: "Магазин одежды Binco",
                type: "Одежда",
                location: "Южный район LS",
                discount: "25%",
                owner: "Raccoon_Demure"
            },
            {
                id: 5,
                name: "Премиум Автосалон",
                type: "Автосалон",
                location: "Элитный район LS",
                discount: "5%",
                owner: "Boss"
            }
        ];

        function renderBusinesses(filter) {
            const listContainer = document.getElementById('business-list');
            const countContainer = document.getElementById('biz-count');
            listContainer.innerHTML = '';

            let filtered = filter === 'all' 
                ? businesses 
                : businesses.filter(b => b.type.toLowerCase() === filter.toLowerCase());

            countContainer.textContent = `${filtered.length} шт.`;

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="no-results">В данной категории предприятий пока нет</div>`;
                return;
            }

            filtered.forEach((biz, index) => {
                const card = document.createElement('div');
                card.className = 'business-card';
                card.style.animationDelay = `${index * 0.05}s`;
                card.innerHTML = `
                    <div class="biz-header">
                        <div class="biz-name">${biz.name}</div>
                        <div class="biz-type-badge">${biz.type}</div>
                    </div>
                    <div class="biz-info">
                        <div class="biz-info-row">📍 Локация: <span>${biz.location}</span></div>
                    </div>
                    <div class="card-footer">
                        <div class="discount-tag">Скидка: ${biz.discount}</div>
                        <div class="owner-info">Владелец: <span>${biz.owner}</span></div>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        function filterBusinesses(type, element) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            element.classList.add('active');

            document.getElementById('current-category-title').textContent = type === 'all' ? 'Все бизнесы' : `Категория: ${type}`;

            renderBusinesses(type);
        }

        // Первичный запуск
        renderBusinesses('all');
    </script>
</body>
</html>
