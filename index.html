<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Elite Family | Businesses</title>
    <!-- Telegram Web App JS -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Шрифты Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-card: rgba(18, 18, 24, 0.75);
            --bg-card-hover: rgba(26, 26, 34, 0.9);
            --border-gold: rgba(212, 175, 55, 0.25);
            --border-gold-hover: rgba(212, 175, 55, 0.6);
            --gold-primary: #dfb953;
            --gold-light: #fbe8a6;
            --gold-dark: #9c7b23;
            --text-main: #f3f3f6;
            --text-muted: #94949f;
            --shadow-gold: rgba(223, 185, 83, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: 
                linear-gradient(180deg, rgba(7, 7, 9, 0.88) 0%, rgba(10, 10, 14, 0.92) 50%, rgba(7, 7, 9, 0.95) 100%),
                url('https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            padding-bottom: 140px;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Элитная шапка */
        .header {
            text-align: center;
            padding: 30px 16px 20px;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-gold), transparent);
        }

        .header h1 {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-primary) 50%, var(--gold-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            text-shadow: 0 5px 25px rgba(223, 185, 83, 0.2);
        }

        .header p {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Контейнер */
        .container {
            padding: 20px 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 13px;
            font-weight: 700;
            color: var(--gold-primary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .biz-count {
            font-size: 11px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(5px);
        }

        /* Сетка карточек */
        .grid-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Премиум карточка бизнеса */
        .business-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            padding: 18px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.4s ease forwards;
        }

        .business-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(to bottom, var(--gold-light), var(--gold-dark));
        }

        .business-card:hover {
            border-color: var(--border-gold-hover);
            background: var(--bg-card-hover);
            box-shadow: 0 10px 40px var(--shadow-gold);
            transform: translateY(-2px);
        }

        .biz-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .biz-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .biz-type-badge {
            font-size: 9px;
            font-weight: 700;
            background: linear-gradient(135deg, rgba(223, 185, 83, 0.15), rgba(156, 123, 35, 0.1));
            color: var(--gold-light);
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid rgba(223, 185, 83, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .biz-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
            margin-bottom: 14px;
        }

        .biz-info-row {
            display: flex;
            align-items: center;
            color: var(--text-muted);
        }

        .biz-info-row span {
            color: var(--text-main);
            font-weight: 500;
            margin-left: 8px;
        }

        /* Кликабельная строка для копирования /findibiz */
        .biz-command {
            margin-top: 4px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(212, 175, 55, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .biz-command:hover {
            background: rgba(223, 185, 83, 0.08);
            border-color: var(--gold-primary);
            color: var(--text-main);
        }

        .biz-command code {
            color: var(--gold-light);
            font-weight: 700;
            font-family: monospace;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 12px;
        }

        .discount-tag {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-primary) 50%, var(--gold-dark) 100%);
            color: #0c0c0e;
            font-weight: 800;
            font-size: 11px;
            padding: 6px 14px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(223, 185, 83, 0.25);
        }

        .owner-info {
            font-size: 11px;
            color: var(--text-muted);
            margin-left: auto;
        }

        .owner-info span {
            color: var(--gold-light);
            font-weight: 600;
        }

        /* Блок информации для добавления бизнеса */
        .add-business-banner {
            margin-top: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            padding: 18px;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .add-business-banner h3 {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            color: var(--gold-primary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .add-business-banner p {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .add-business-btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-primary) 50%, var(--gold-dark) 100%);
            color: #0c0c0e;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 10px;
            letter-spacing: 1px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(223, 185, 83, 0.25);
        }

        .add-business-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(223, 185, 83, 0.4);
        }

        /* Нижняя панель навигации */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 14, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-gold);
            display: flex;
            overflow-x: auto;
            padding: 14px 12px;
            gap: 10px;
            z-index: 1000;
            scrollbar-width: none;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.6);
        }

        .bottom-nav::-webkit-scrollbar {
            display: none;
        }

        .nav-item {
            flex: 0 0 auto;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.01) 100%);
            border: 1px solid rgba(212, 175, 55, 0.15);
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            letter-spacing: 1px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .nav-item:hover {
            border-color: var(--border-gold);
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.06);
        }

        .nav-item.active {
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-primary) 50%, var(--gold-dark) 100%);
            color: #0c0c0e;
            border-color: var(--gold-light);
            font-weight: 800;
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.5), 0 0 20px rgba(223, 185, 83, 0.4);
            transform: translateY(-2px);
        }

        .no-results {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
            font-size: 13px;
            letter-spacing: 1px;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px dashed var(--border-gold);
            backdrop-filter: blur(12px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Family Syndicate</h1>
        <p>Реестр предприятий и привилегий</p>
    </div>

    <div class="container">
        <div class="section-header">
            <div class="section-title" id="current-category-title">Все бизнесы</div>
            <div class="biz-count" id="biz-count">0 шт.</div>
        </div>

        <div class="grid-list" id="business-list"></div>

        <!-- Информационный блок внизу -->
        <div class="add-business-banner">
            <h3>Хотите добавить свой бизнес?</h3>
            <p>Если вы хотите разместить своё предприятие на сайте, отпишите менеджеру в личные сообщения.</p>
            <a href="https://t.me/demure_support" target="_blank" class="add-business-btn">Связаться с менеджером</a>
        </div>
    </div>

    <!-- Нижняя панель фильтров -->
    <div class="bottom-nav" id="filter-nav">
        <div class="nav-item active" onclick="filterBusinesses('all', this)">Все</div>
        <div class="nav-item" onclick="filterBusinesses('АЗС', this)">АЗС</div>
        <div class="nav-item" onclick="filterBusinesses('24/7', this)">24/7</div>
        <div class="nav-item" onclick="filterBusinesses('Закусочная', this)">Закусочная</div>
        <div class="nav-item" onclick="filterBusinesses('Амуниция', this)">Амуниция</div>
        <div class="nav-item" onclick="filterBusinesses('Частная', this)">Частная</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const businesses = [
            // АЗС
            { id: 1, name: "АЗС/Магазин механики №31", type: "АЗС", location: "Лос-Сантос (ЛС)", discount: "80%", owner: "Raccoon_Demure" },
            { id: 2, name: "АЗС/Магазин механики №261", type: "АЗС", location: "Грин таун (Мост ЛС-ЛВ)", discount: "80%", owner: "Raccoon_Demure" },
            { id: 3, name: "АЗС/Магазин механики №59", type: "АЗС", location: "Лас-Вентурас (ЛВ)", discount: "80%", owner: "Raccoon_Demure" },
            { id: 4, name: "АЗС №253", type: "АЗС", location: "Ферма новичков (Водная)", discount: "0%", owner: "Win_Bet" },
            { id: 5, name: "АЗС №355", type: "АЗС", location: "Заброшенный аэропорт", discount: "90%", owner: "Win_Bet" },
            { id: 6, name: "АЗС №25", type: "АЗС", location: "Сан-Фиеро (Свалка СФ)", discount: "88%", owner: "Nays_Demure" },
            { id: 7, name: "АЗС №60", type: "АЗС", location: "Лас-Вентурас (ЛВ)", discount: "55%", owner: "Nays_Demure" },
            { id: 8, name: "АЗС №288", type: "АЗС", location: "Лас-Вентурас (ЛВ)", discount: "50%", owner: "Nays_Demure" },

            // Закусочные
            { id: 9, name: "Закусочная №109", type: "Закусочная", location: "Сан-Фиеро (СФ)", discount: "70%", owner: "Tarik_Demure" },
            { id: 10, name: "Закусочная №110", type: "Закусочная", location: "Сан-Фиеро (СФ)", discount: "70%", owner: "Tarik_Demure" },
            { id: 11, name: "Закусочная №114", type: "Закусочная", location: "Гора Чилиад (СФ)", discount: "70%", owner: "Tarik_Demure" },
            { id: 12, name: "Закусочная №50", type: "Закусочная", location: "Лос-Сантос (Центральный рынок ЛС)", discount: "90%", owner: "Hazard_Demure" },
            { id: 13, name: "Закусочная №80", type: "Закусочная", location: "Лас-Вентурас (ЛВ)", discount: "50%", owner: "Blaze_Demure" },
            { id: 14, name: "Закусочная №358", type: "Закусочная", location: "Гора Чилиад (СФ)", discount: "50%", owner: "Blaze_Demure" },
            { id: 15, name: "Закусочная №167", type: "Закусочная", location: "Лос-Сантос (Гетто респа Ацтек)", discount: "90%", owner: "Win_Bet" },
            { id: 16, name: "Закусочная №169", type: "Закусочная", location: "Половино-Крик (ПК)", discount: "90%", owner: "Astra_Reckless" },
            { id: 17, name: "Закусочная №168", type: "Закусочная", location: "Ред-Каунтри (Ферма новичков РК)", discount: "50%", owner: "Feo_Zotti" },

            // 24/7 / Закупки
            { id: 18, name: "Магазин 24/7 №102", type: "24/7", location: "Сан-Фиеро (СФ около Страховой компании)", discount: "50%", owner: "Matvey_Demure" },
            { id: 19, name: "Закупка №353", type: "24/7", location: "Лос-Сантос (ЛС)", discount: "50%", owner: "Hazard_Demure" },
            { id: 20, name: "Закупка №17", type: "24/7", location: "Гора Чилиад (СФ)", discount: "90%", owner: "Hazard_Demure" },
            { id: 21, name: "Закупка №75", type: "24/7", location: "Лас-Вентурас (ЛВ)", discount: "90%", owner: "Win_Bet" },
            { id: 22, name: "Закупка №11", type: "24/7", location: "Ред-Каунтри (Ферма новичков РК)", discount: "50%", owner: "Feo_Zotti" },
            { id: 23, name: "Закупка №176", type: "24/7", location: "Сан-Фиеро (СФ)", discount: "50%", owner: "Feo_Zotti" },

            // Амуниция
            { id: 24, name: "Аммуниция №2", type: "Амуниция", location: "Ред-Каунтри (Ферма новичков РК)", discount: "90%", owner: "Feo_Zotti" },
            
            // Частные
            { id: 25, name: "Страховая компания", type: "Частная", location: "Сан-Фиерро напротив банка", owner: "Raccoon_Demure" },
            { id: 26, name: "Varios Los Aztecas", type: "Частная", location: "Криминальный район ГЕТТО", owner: "Raccoon_Demure" }
        ];

        function extractId(name) {
            const matches = name.match(/\d+/);
            return matches ? matches[0] : '';
        }

        function copyFindCommand(bizName, event) {
            event.stopPropagation();
            const id = extractId(bizName);
            if (!id) return;
            
            const commandText = `/findibiz ${id}`;

            navigator.clipboard.writeText(commandText).then(() => {
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                }
                
                const target = event.currentTarget;
                const originalHTML = target.innerHTML;
                target.innerHTML = `<span style="color: var(--gold-primary);">✅ Скопировано: ${commandText}</span>`;
                
                setTimeout(() => {
                    target.innerHTML = originalHTML;
                }, 1500);
            }).catch(err => {
                console.error('Ошибка копирования: ', err);
            });
        }

        function renderBusinesses(filter) {
            const listContainer = document.getElementById('business-list');
            const countContainer = document.getElementById('biz-count');
            listContainer.innerHTML = '';

            let filtered = filter === 'all' 
                ? businesses 
                : businesses.filter(b => b.type.toLowerCase() === filter.toLowerCase());

            countContainer.textContent = `${filtered.length} шт.`;

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="no-results">В данной категории предприятий пока нет</div>`;
                return;
            }

            filtered.forEach((biz, index) => {
                const card = document.createElement('div');
                card.className = 'business-card';
                card.style.animationDelay = `${index * 0.05}s`;

                let footerContent = '';
                if (biz.discount && biz.discount !== "0%") {
                    footerContent = `
                        <div class="discount-tag">Скидка: ${biz.discount}</div>
                        <div class="owner-info">Владелец: <span>${biz.owner}</span></div>
                    `;
                } else {
                    footerContent = `
                        <div class="owner-info">Владелец: <span>${biz.owner}</span></div>
                    `;
                }

                // Условие: если тип бизнеса не "Частная", выводим блок с командой /findibiz
                let commandHTML = '';
                if (biz.type.toLowerCase() !== 'частная') {
                    const bizId = extractId(biz.name);
                    commandHTML = `
                        <div class="biz-command" onclick="copyFindCommand('${biz.name}', event)">
                            📋 Скопировать команду: <code>/findibiz ${bizId}</code>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="biz-header">
                        <div class="biz-name">${biz.name}</div>
                        <div class="biz-type-badge">${biz.type}</div>
                    </div>
                    <div class="biz-info">
                        <div class="biz-info-row">📍 Локация: <span>${biz.location}</span></div>
                        ${commandHTML}
                    </div>
                    <div class="card-footer">
                        ${footerContent}
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        function filterBusinesses(type, element) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            element.classList.add('active');

            document.getElementById('current-category-title').textContent = type === 'all' ? 'Все бизнесы' : `Категория: ${type}`;

            renderBusinesses(type);
        }

        renderBusinesses('all');
    </script>
</body>
</html>
